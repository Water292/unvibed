name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # mise downloads tools from GitHub; the token avoids API rate limits.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      # The same command a person runs; it ends with `mise run check`.
      - run: scripts/setup.sh
